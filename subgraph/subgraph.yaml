specVersion: 1.2.0
description: RWA Outlets — instant-liquidity market for tokenized RWAs on 1inch
  Aqua/SwapVM. Indexes pools (Aqua strategies), NavExtruction trades, the
  OutletRouter, ERC-7540 redemption queues, curator vaults, NAV oracle, KYC set,
  and the Uniswap v4 lane.
repository: https://github.com/rwa-outlets
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum
    name: Aqua
    network: sepolia
    source:
      address: "0xA787Dd5eF559569b068283D2617e0D8484C08e9B"
      abi: Aqua
      startBlock: 11348446
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Strategy
        - StrategyBalance
        - Protocol
      abis:
        - name: Aqua
          file: ./abis/Aqua.json
      eventHandlers:
        - event: Shipped(address,address,bytes32,bytes)
          handler: handleShipped
        - event: Docked(address,address,bytes32)
          handler: handleDocked
        - event: Pushed(address,address,bytes32,address,uint256)
          handler: handlePushed
        - event: Pulled(address,address,bytes32,address,uint256)
          handler: handlePulled
      file: ./src/aqua.ts
  - kind: ethereum
    name: AquaSwapVMRouter
    network: sepolia
    source:
      address: "0xc4D05Fc049B819DAAf2753d5a0D32402b8a76d47"
      abi: AquaSwapVMRouter
      startBlock: 11348447
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Fill
        - Trade
        - Strategy
        - Protocol
      abis:
        - name: AquaSwapVMRouter
          file: ./abis/AquaSwapVMRouter.json
      eventHandlers:
        - event: Swapped(bytes32,address,address,address,address,uint256,uint256)
          handler: handleSwapped
      file: ./src/swapVM.ts
  - kind: ethereum
    name: NavOracle
    network: sepolia
    source:
      address: "0x49f587A7203C2CE7765CAcdD0D5bf912BF52a692"
      abi: NavOracle
      startBlock: 11348451
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Asset
        - NavPoint
        - OracleKeeper
      abis:
        - name: NavOracle
          file: ./abis/NavOracle.json
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: NavUpdated(indexed address,uint256,uint256)
          handler: handleNavUpdated
        - event: KeeperSet(indexed address,bool)
          handler: handleKeeperSet
      file: ./src/navOracle.ts
  - kind: ethereum
    name: NavExtruction
    network: sepolia
    source:
      address: "0xFD8C2d242e82F7Ba28a2a038461C45481EA3849A"
      abi: NavExtruction
      startBlock: 11348451
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Trade
        - Strategy
        - Asset
        - Protocol
        - ProtocolDayData
        - AssetDayData
      abis:
        - name: NavExtruction
          file: ./abis/NavExtruction.json
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: Trade(indexed bytes32,indexed uint8,indexed
            address,bool,address,address,uint256,uint256,int256)
          handler: handleTrade
      file: ./src/navExtruction.ts
  - kind: ethereum
    name: ComplianceNFT
    network: sepolia
    source:
      address: "0x82E0649Ec0783985FeB4201f126783bD4fC31031"
      abi: ComplianceNFT
      startBlock: 11348451
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - KycHolder
        - ComplianceOperator
        - Protocol
      abis:
        - name: ComplianceNFT
          file: ./abis/ComplianceNFT.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,indexed uint256)
          handler: handleTransfer
        - event: OperatorSet(indexed address,bool)
          handler: handleOperatorSet
      file: ./src/compliance.ts
  - kind: ethereum
    name: OutletRouter
    network: sepolia
    source:
      address: "0x9C352AE4df4853D25F2691c9183c336E0c112289"
      abi: OutletRouter
      startBlock: 11348471
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - RouterListing
        - RouterSwap
        - PatientEnqueue
        - TwapGuard
        - Strategy
        - V4Pool
      abis:
        - name: OutletRouter
          file: ./abis/OutletRouter.json
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: StrategyRegistered(indexed address,indexed bytes32,indexed
            address,address)
          handler: handleStrategyRegistered
        - event: StrategyDelisted(indexed address,indexed bytes32)
          handler: handleStrategyDelisted
        - event: GuardSet(indexed address,address,bytes32,uint32,uint16)
          handler: handleGuardSet
        - event: InstantExit(indexed address,indexed address,indexed
            bytes32,uint256,uint256)
          handler: handleInstantExit
        - event: Purchase(indexed address,indexed address,indexed bytes32,uint256,uint256)
          handler: handlePurchase
        - event: PatientEnqueued(indexed address,indexed address,indexed uint256,uint256)
          handler: handlePatientEnqueued
      file: ./src/router.ts
  - kind: ethereum
    name: RedemptionQueueTbill
    network: sepolia
    source:
      address: "0xBf14ed0b9E2d3A167f9119082440A91C9C810472"
      abi: RedemptionQueue
      startBlock: 11348471
    mapping: &a1
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Queue
        - QueueEpoch
        - QueueRequest
        - QueueController
        - QueueClaim
        - OperatorApproval
        - Account
      abis:
        - name: RedemptionQueue
          file: ./abis/RedemptionQueue.json
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: RedeemRequest(indexed address,indexed address,indexed
            uint256,address,uint256)
          handler: handleRedeemRequest
        - event: Submitted(indexed uint256,uint256)
          handler: handleSubmitted
        - event: Settled(indexed uint256,uint256,uint256)
          handler: handleSettled
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: OperatorSet(indexed address,indexed address,bool)
          handler: handleOperatorSet
        - event: FeesClaimed(indexed address,uint256)
          handler: handleFeesClaimed
        - event: RolesSet(address,address,address)
          handler: handleRolesSet
      file: ./src/queue.ts
  - kind: ethereum
    name: RedemptionQueueCredit
    network: sepolia
    source:
      address: "0xb12EE4D7f546C5B6Cb3EcC2b770B9b6780354502"
      abi: RedemptionQueue
      startBlock: 11348471
    mapping: *a1
  - kind: ethereum
    name: CuratorVaultExpress
    network: sepolia
    source:
      address: "0x4AaAB2c212dA4d261E5F50F5A97B5d2d3892E204"
      abi: CuratorVault
      startBlock: 11348471
    mapping: &a2
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Vault
        - VaultEpoch
        - VaultRedeemRequest
        - VaultController
        - VaultDeposit
        - VaultClaim
        - VaultPosition
        - MandateAsset
        - RecycleAction
        - VaultQueueClaim
        - Strategy
        - OperatorApproval
        - Account
      abis:
        - name: CuratorVault
          file: ./abis/CuratorVault.json
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,uint256,uint256)
          handler: handleDeposit
        - event: RedeemRequest(indexed address,indexed address,indexed
            uint256,address,uint256)
          handler: handleRedeemRequest
        - event: Withdraw(indexed address,indexed address,indexed address,uint256,uint256)
          handler: handleWithdraw
        - event: OperatorSet(indexed address,indexed address,bool)
          handler: handleOperatorSet
        - event: EpochFulfilled(indexed uint256,uint256,uint256)
          handler: handleEpochFulfilled
        - event: MandateAssetAdded(indexed address,address,uint256)
          handler: handleMandateAssetAdded
        - event: PoolCreated(indexed bytes32,indexed address,uint8,uint256,uint256,bytes)
          handler: handlePoolCreated
        - event: PoolDocked(indexed bytes32,indexed address)
          handler: handlePoolDocked
        - event: Recycled(indexed address,uint256,indexed uint256)
          handler: handleRecycled
        - event: QueueClaimed(indexed address,uint256,uint256,uint256)
          handler: handleQueueClaimed
        - event: RolesSet(address,address)
          handler: handleRolesSet
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleShareTransfer
      file: ./src/vault.ts
  - kind: ethereum
    name: CuratorVaultPatient
    network: sepolia
    source:
      address: "0x4C299f2cE2D07C77e8280a286241e0a30EaD9ae9"
      abi: CuratorVault
      startBlock: 11348471
    mapping: *a2
  - kind: ethereum
    name: RWAGateHook
    network: sepolia
    source:
      address: "0x06Ae6eeAfC42d4Ca4158Bd3BddC4B14Cc54948C0"
      abi: RWAGateHook
      startBlock: 11348473
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - V4Pool
        - Observation
      abis:
        - name: RWAGateHook
          file: ./abis/RWAGateHook.json
      eventHandlers:
        - event: ObservationRecorded(indexed bytes32,uint160,uint256,uint256)
          handler: handleObservation
        - event: ObservationRecorded(indexed bytes32,uint160,uint256)
          handler: handleObservationLegacy
      file: ./src/hook.ts
  - kind: ethereum
    name: TestUSDC
    network: sepolia
    source:
      address: "0x062b2F19C852e486b4b913933420957018d1db31"
      abi: RWAToken
      startBlock: 11347862
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Asset
        - TokenBalance
        - Vault
      abis:
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/tokens.ts
  - kind: ethereum
    name: RwaTbillToken
    network: sepolia
    source:
      address: "0x5456E52531085291a35CF0d902aE72D6616b665D"
      abi: RWAToken
      startBlock: 11347863
    mapping: &a3
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Asset
        - TokenBalance
        - Vault
      abis:
        - name: RWAToken
          file: ./abis/RWAToken.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
        - event: GatedSet(bool)
          handler: handleGatedSet
      file: ./src/tokens.ts
  - kind: ethereum
    name: RwaCreditToken
    network: sepolia
    source:
      address: "0xFbca2B3334138C109D51f5101343DE0A35a0eDD9"
      abi: RWAToken
      startBlock: 11347864
    mapping: *a3
  - kind: ethereum
    name: Faucet
    network: sepolia
    source:
      address: "0xE78E87D994358D17aaf4653d8398f22C93fb758A"
      abi: Faucet
      startBlock: 11347861
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - FaucetDrip
        - Account
        - Protocol
      abis:
        - name: Faucet
          file: ./abis/Faucet.json
      eventHandlers:
        - event: Dripped(indexed address,indexed address,uint256)
          handler: handleDripped
      file: ./src/faucet.ts
